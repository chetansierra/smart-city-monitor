apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-simulator
  labels:
    app: sensor-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-simulator
  template:
    metadata:
      labels:
        app: sensor-simulator
    spec:
      containers:
        - name: sensor-simulator
          image: smart-city-monitor/sensor-simulator:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-simulator
spec:
  selector:
    app: sensor-simulator
  ports:
    - port: 80
      targetPort: 8081
  type: LoadBalancer
