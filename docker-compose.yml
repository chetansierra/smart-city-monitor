services:
  # Kafka Broker (KRaft mode - no Zookeeper required)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9094"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT_INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - smart-city-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka UI - Web interface for Kafka
  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   container_name: kafka-ui
  #   depends_on:
  #     - kafka
  #   ports:
  #     - "8081:8080"
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: smart-city-cluster
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
  #     KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
  #   networks:
  #     - smart-city-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: smart_city
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - smart-city-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d smart_city"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-ttl
    networks:
      - smart-city-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - PostgreSQL web UI
  adminer:
    image: adminer:latest
    container_name: adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - smart-city-network
    restart: unless-stopped

  # Redis Commander - Web UI for Redis (optional)
  # redis-commander:
  #   image: rediscommander/redis-commander:latest
  #   container_name: redis-commander
  #   platform: linux/amd64
  #   depends_on:
  #     - redis
  #   ports:
  #     - "8082:8081"
  #   environment:
  #     REDIS_HOSTS: local:redis:6379
  #   networks:
  #     - smart-city-network

  # API Gateway - REST API and SSE server
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.api-gateway
    container_name: api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smart_city
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_CONNECTIONS: 25
      POSTGRES_MAX_IDLE_CONNECTIONS: 5
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      KAFKA_BROKERS: kafka:9093
      KAFKA_TOPIC_SENSOR_READINGS: sensor-readings
      KAFKA_TOPIC_ADMIN_COMMANDS: admin-commands
    networks:
      - smart-city-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Ingestion - Consumes raw sensor data and stores it in Postgres
  data-ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile.data-ingestion
    container_name: data-ingestion
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smart_city
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_CONNECTIONS: 25
      POSTGRES_MAX_IDLE_CONNECTIONS: 5
      KAFKA_BROKERS: kafka:9093
      KAFKA_TOPIC_SENSOR_READINGS: sensor-readings
      KAFKA_CONSUMER_GROUP_INGESTION: data-ingestion-group
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
    networks:
      - smart-city-network
    restart: unless-stopped

  # Sensor Simulator - Generates mock sensor data
  sensor-simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile.sensor-simulator
    container_name: sensor-simulator
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smart_city
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_SSLMODE: disable
      KAFKA_BROKERS: kafka:9093
      KAFKA_TOPIC_SENSOR_READINGS: sensor-readings
      SENSOR_COUNT: 50
      GENERATION_INTERVAL_MS: 1000
      SIMULATOR_START_EMPTY: "false"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
    networks:
      - smart-city-network
    restart: unless-stopped

  # Frontend - React dashboard with nginx
  # Commented out for local development (run with npm run dev in ./frontend)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: frontend
  #   depends_on:
  #     api-gateway:
  #       condition: service_healthy
  #   ports:
  #     - "3000:80"
  #   environment:
  #     - VITE_API_URL=http://localhost:8080/api/v1
  #     - VITE_STREAM_URL=http://localhost:8080/stream
  #   networks:
  #     - smart-city-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
  #     interval: 30s
  #     timeout: 3s
  #     retries: 3

networks:
  smart-city-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
